<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- ล็อกการซูมหน้าจออัตโนมัติบนมือถือ ป้องกันหน้าต่างเด้งไปมาเวลากรอกฟอร์ม -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ระบบบันทึกข้อมูลนักเรียน</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f8ff; 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .text-brand-blue { color: #0284c7; }
        .bg-brand-blue { background-color: #0284c7; }
        .hover-bg-brand-blue:hover { background-color: #0369a1; }
        .text-brand-orange { color: #f97316; }
        .bg-brand-orange { background-color: #f97316; }
        .hover-bg-brand-orange:hover { background-color: #ea580c; }
        
        /* เพิ่ม Safe Area ป้องกันปุ่มโดนขอบจอด้านล่างของ iPhone รบกวน */
        .safe-area-pb {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* ========================================================
           การตั้งค่า UI แบบเจาะจง: ล็อกไอคอนซ้าย + ข้อความกึ่งกลาง
           ======================================================== */
        
        /* 1. บังคับให้ข้อความในฟอร์มทุกฟอร์มอยู่กึ่งกลาง */
        input[type="text"], 
        input[type="tel"], 
        input[type="number"], 
        select {
            text-align: center !important;
            text-align-last: center !important; /* จัดกึ่งกลางสำหรับดรอปดาวน์ */
        }
        
        input::placeholder {
            text-align: center !important;
            color: #9ca3af !important;
        }

        /* 2. แก้ปัญหาไอคอนซ้อนทับข้อความ และจัดให้ padding ซ้ายขวาเท่ากัน 
              เพื่อให้ text-center อยู่ตรงกลางกล่องแบบ 100% สมมาตร */
        .relative i.fas + input, 
        .relative i.fas + select {
            padding-left: 3.25rem !important;  /* ล็อกพื้นที่ให้ไอคอนด้านซ้ายเสมอ */
            padding-right: 3.25rem !important; /* ดันขอบขวาให้สมมาตร ข้อความจะได้กึ่งกลางเป๊ะ */
        }

        /* 3. ล็อกไอคอนให้อยู่ซ้ายเสมอ ไม่ว่าหน้าจอจะขยายหรือหด (ป้องกัน Responsive ไปทับ) */
        .relative > i.fas {
            position: absolute !important;
            left: 1.25rem !important; /* ชิดซ้ายเสมอ */
            top: 50% !important;
            transform: translateY(-50%) !important;
            pointer-events: none !important; /* ทะลุการคลิกไปที่ช่องกรอก */
            z-index: 10;
        }
    </style>
</head>
<!-- ปรับ p-0 บนจอมือถือเพื่อให้ฟอร์มแนบขอบจอ (Edge to edge) และจัดให้อยู่ด้านบน -->
<body class="min-h-screen flex items-start sm:items-center justify-center p-0 sm:p-4 md:p-8">

    <div id="root" class="w-full max-w-4xl"></div>

    <script type="text/babel">
        const { useState } = React;

        const GAS_URL = "https://script.google.com/macros/s/AKfycbzyFd2PHIHV9ctddwktKKuqjnQF-Wr12zHWuczWpXNmWg8FzYzCTALx48RIdSnPWQMw/exec";

        const App = () => {
            const [step, setStep] = useState(1);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSuccess, setIsSuccess] = useState(false);
            const [showFinalPopup, setShowFinalPopup] = useState(false); 
            const [alertMsg, setAlertMsg] = useState(''); 
            const [duplicateAlert, setDuplicateAlert] = useState(null); 

            const getCachedData = () => {
                try {
                    const cached = sessionStorage.getItem('schoolAppCache_v13');
                    if (cached) return JSON.parse(cached);
                } catch(e) {}
                return null; 
            };

            const cachedInitData = getCachedData();

            const [initialData, setInitialData] = useState(cachedInitData || { 
                students: [], settings: {}, provinces: [], teachers: [],
                schoolName: 'ระบบขึ้นทะเบียนนักเรียน', schoolLogo: ''
            });
            
            const [isLoadingData, setIsLoadingData] = useState(!cachedInitData);

            const [formData, setFormData] = useState({
                studentCode: '', nationalId: '', fullName: '', classLevel: '', room: '', 
                religion: '', religionOther: '', studentTel: '', advisor: '',
                dobDay: '', dobMonth: '', dobYear: '', age: '', program: '',
                
                weight: '', height: '', bmi: '', bmiResult: '',
                hasDisease: 'false', diseaseName: '', regularMeds: '',
                hasDisability: 'false', disabilityName: '',

                fatherTitle: '', fatherTitleOther: '', fatherFirstName: '', fatherLastName: '', fatherTel: '', fatherOccupation: '', fatherIncome: '', fatherUnemployed: false,
                motherTitle: '', motherTitleOther: '', motherFirstName: '', motherLastName: '', motherTel: '', motherOccupation: '', motherIncome: '', motherUnemployed: false,
                parentsStatus: '', livingWith: '',

                parentTitle: '', parentTitleOther: '', parentFirstName: '', parentLastName: '',
                parentRelation: '', parentTel: '',
                parentUnemployed: false, parentOccupation: '', parentWorkplace: '', parentIncome: '',

                addrNo: '', addrMoo: '', addrSub: '', addrDist: '', addrProv: '', addrZip: ''
            });

            React.useEffect(() => {
                const fetchLogoFast = async () => {
                    try {
                        const res = await fetch(`${GAS_URL}?action=getAppInfo`);
                        const textRes = await res.text();
                        if (textRes.includes("System API Online")) return;
                        
                        const result = JSON.parse(textRes);
                        if (result.status === 'success') {
                            let rawLogo = result.schoolLogo || '';
                            rawLogo = rawLogo.replace(/[\r\n\t\s]+/g, ''); 
                            if (rawLogo.includes('drive.google.com')) {
                                const matchId = rawLogo.match(/[-\w]{25,}/); 
                                if (matchId && matchId[0]) {
                                    rawLogo = `https://lh3.googleusercontent.com/d/${matchId[0]}`;
                                }
                            }
                            setInitialData(prev => ({ ...prev, schoolName: result.schoolName || prev.schoolName, schoolLogo: rawLogo }));
                        }
                    } catch(e) {
                        console.warn("Fast logo load skipped");
                    }
                };

                const fetchFromGAS = async (isSilent = false) => {
                    if (!isSilent) setIsLoadingData(true);
                    try {
                        const res = await fetch(`${GAS_URL}?action=getInitialData`);
                        const textRes = await res.text();
                        
                        if (textRes.includes("System API Online")) {
                            throw new Error("ยังไม่ได้อัปเดตสคริปต์: กรุณากดปุ่ม Deploy -> New Deployment");
                        }
                        
                        const result = JSON.parse(textRes);
                        if (result.status === 'success') {
                            let rawLogo = result.schoolLogo || '';
                            rawLogo = rawLogo.replace(/[\r\n\t\s]+/g, ''); 
                            if (rawLogo.includes('drive.google.com')) {
                                const matchId = rawLogo.match(/[-\w]{25,}/); 
                                if (matchId && matchId[0]) {
                                    rawLogo = `https://lh3.googleusercontent.com/d/${matchId[0]}`;
                                }
                            }
                            const newData = { 
                                students: result.students || [], settings: result.settings || {},
                                provinces: result.provinces || [], teachers: result.teachers || [],
                                schoolName: result.schoolName || 'ระบบขึ้นทะเบียนนักเรียน', schoolLogo: rawLogo
                            };
                            setInitialData(newData);
                            sessionStorage.setItem('schoolAppCache_v13', JSON.stringify(newData));
                        }
                    } catch (e) {
                        console.error("Failed to load initial data", e);
                        if (e.message.includes("Deploy")) setAlertMsg(e.message);
                    } finally {
                        if (!isSilent) setIsLoadingData(false);
                    }
                };

                if (!cachedInitData) {
                    fetchLogoFast();
                    fetchFromGAS(false);
                } else {
                    fetchFromGAS(true);
                }
            }, []);

            React.useEffect(() => {
                if (formData.classLevel && formData.room && initialData.teachers.length > 0) {
                    const shortClass = formData.classLevel.replace('มัธยมศึกษาปีที่ ', 'ม.');
                    const roomStr = String(formData.room);
                    const matchedTeachers = initialData.teachers.filter(t => t.classLevel === shortClass && String(t.room) === roomStr);
                    const advisorNames = matchedTeachers.map(t => t.name).join(', ');
                    if (formData.advisor !== advisorNames) setFormData(prev => ({ ...prev, advisor: advisorNames }));
                } else if (formData.advisor !== '') {
                    setFormData(prev => ({ ...prev, advisor: '' }));
                }
            }, [formData.classLevel, formData.room, initialData.teachers]);

            const availablePrograms = React.useMemo(() => {
                const classKey = formData.classLevel;
                const roomKey = formData.room ? `${classKey}/${formData.room}` : '';
                let options = [];
                let planStr = '';
                const findPlans = (obj) => {
                    if (!obj) return '';
                    if (obj.learning_plans && typeof obj.learning_plans === 'string') return obj.learning_plans;
                    if (typeof obj === 'object') {
                        for (let k in obj) {
                            if (obj[k] && typeof obj[k] === 'object') {
                                let found = findPlans(obj[k]);
                                if (found) return found;
                            }
                        }
                    }
                    return '';
                };
                
                planStr = findPlans(initialData.settings);

                if (planStr) {
                    const lines = planStr.split('\n');
                    lines.forEach(line => {
                        const parts = line.split(':');
                        if (parts.length >= 2) {
                            const planName = parts[0].trim();
                            const rooms = parts.slice(1).join(':').split(',').map(r => r.trim());
                            if (roomKey) {
                                if (rooms.includes(roomKey)) options.push(planName);
                            } else if (classKey) {
                                if (rooms.some(r => r.startsWith(classKey + '/'))) {
                                    if (!options.includes(planName)) options.push(planName);
                                }
                            }
                        }
                    });
                }
                return options;
            }, [formData.classLevel, formData.room, initialData.settings]);

            React.useEffect(() => {
                if (formData.classLevel && formData.room) {
                    if (availablePrograms.length === 1) {
                        if (formData.program !== availablePrograms[0]) setFormData(prev => ({ ...prev, program: availablePrograms[0] }));
                    } else if (availablePrograms.length > 1) {
                        if (!availablePrograms.includes(formData.program)) setFormData(prev => ({ ...prev, program: '' }));
                    } else {
                         if (formData.program !== '') setFormData(prev => ({ ...prev, program: '' }));
                    }
                }
            }, [availablePrograms, formData.classLevel, formData.room]);

            React.useEffect(() => {
                if (formData.livingWith === 'บิดา') {
                    setFormData(prev => ({ ...prev,
                        parentTitle: prev.fatherTitle || '', parentTitleOther: prev.fatherTitleOther || '',
                        parentFirstName: prev.fatherFirstName || '', parentLastName: prev.fatherLastName || '',
                        parentRelation: 'บิดา', parentTel: prev.fatherTel || '',
                        parentOccupation: prev.fatherOccupation || '', parentIncome: prev.fatherIncome || '',
                        parentUnemployed: prev.fatherUnemployed, parentWorkplace: '-'
                    }));
                } else if (formData.livingWith === 'มารดา' || formData.livingWith === 'บิดามารดา') {
                    setFormData(prev => ({ ...prev,
                        parentTitle: prev.motherTitle || '', parentTitleOther: prev.motherTitleOther || '',
                        parentFirstName: prev.motherFirstName || '', parentLastName: prev.motherLastName || '',
                        parentRelation: 'มารดา', parentTel: prev.motherTel || '',
                        parentOccupation: prev.motherOccupation || '', parentIncome: prev.motherIncome || '',
                        parentUnemployed: prev.motherUnemployed, parentWorkplace: '-'
                    }));
                }
            }, [
                formData.livingWith, 
                formData.fatherTitle, formData.fatherTitleOther, formData.fatherFirstName, formData.fatherLastName, formData.fatherTel, formData.fatherOccupation, formData.fatherIncome, formData.fatherUnemployed,
                formData.motherTitle, formData.motherTitleOther, formData.motherFirstName, formData.motherLastName, formData.motherTel, formData.motherOccupation, formData.motherIncome, formData.motherUnemployed
            ]);

            const uniqueProvinces = React.useMemo(() => [...new Set(initialData.provinces.map(p => p.prov))].filter(Boolean).sort(), [initialData.provinces]);
            const availableDistricts = React.useMemo(() => {
                if (!formData.addrProv) return [];
                return [...new Set(initialData.provinces.filter(p => p.prov === formData.addrProv).map(p => p.dist))].filter(Boolean).sort();
            }, [initialData.provinces, formData.addrProv]);
            const availableSubs = React.useMemo(() => {
                if (!formData.addrProv || !formData.addrDist) return [];
                return [...new Set(initialData.provinces.filter(p => p.prov === formData.addrProv && p.dist === formData.addrDist).map(p => p.sub))].filter(Boolean).sort();
            }, [initialData.provinces, formData.addrProv, formData.addrDist]);

            const handleChange = (e) => {
                const target = e.target;
                const name = target.name;
                const value = target.type === 'checkbox' ? target.checked : target.value;
                let newForm = { ...formData, [name]: value };

                if (name === 'classLevel' || name === 'room') {
                    newForm.fullName = ''; newForm.studentCode = ''; newForm.program = '';
                }
                if (['dobDay', 'dobMonth', 'dobYear'].includes(name)) {
                    newForm.age = calculateAge(newForm.dobDay, newForm.dobMonth, newForm.dobYear);
                }
                
                if (name === 'weight' || name === 'height') {
                    const w = parseFloat(name === 'weight' ? value : newForm.weight);
                    const h = parseFloat(name === 'height' ? value : newForm.height);
                    
                    if (w > 0 && h > 0) {
                        const hInMeters = h / 100;
                        const bmiValue = (w / (hInMeters * hInMeters)).toFixed(2);
                        newForm.bmi = bmiValue;
                        
                        if (bmiValue < 18.5) newForm.bmiResult = "น้ำหนักน้อย / ผอม";
                        else if (bmiValue >= 18.5 && bmiValue <= 22.9) newForm.bmiResult = "ปกติ (สุขภาพดี)";
                        else if (bmiValue >= 23.0 && bmiValue <= 24.9) newForm.bmiResult = "ท้วม / อ้วนระดับ 1";
                        else if (bmiValue >= 25.0 && bmiValue <= 29.9) newForm.bmiResult = "อ้วน / อ้วนระดับ 2";
                        else if (bmiValue >= 30.0) newForm.bmiResult = "อ้วนมาก / อ้วนระดับ 3";
                    } else {
                        newForm.bmi = '';
                        newForm.bmiResult = '';
                    }
                }

                if (name === 'hasDisease' && value === 'false') {
                    newForm.diseaseName = '';
                    newForm.regularMeds = '';
                }
                if (name === 'hasDisability' && value === 'false') {
                    newForm.disabilityName = '';
                }

                if (name === 'fatherUnemployed') {
                    newForm.fatherOccupation = value ? 'ไม่ได้ประกอบอาชีพ' : '';
                    newForm.fatherIncome = value ? '-' : '';
                }
                if (name === 'motherUnemployed') {
                    newForm.motherOccupation = value ? 'ไม่ได้ประกอบอาชีพ' : '';
                    newForm.motherIncome = value ? '-' : '';
                }
                if (name === 'parentUnemployed') {
                    newForm.parentOccupation = value ? 'ไม่ได้ประกอบอาชีพ' : '';
                    newForm.parentWorkplace = value ? '-' : '';
                    newForm.parentIncome = value ? '-' : '';
                }

                if (name === 'livingWith' && value === 'ผู้ปกครองที่ไม่ใช่บิดามารดา') {
                    newForm.parentTitle = ''; newForm.parentFirstName = ''; newForm.parentLastName = '';
                    newForm.parentRelation = ''; newForm.parentTel = ''; newForm.parentOccupation = '';
                    newForm.parentIncome = ''; newForm.parentWorkplace = ''; newForm.parentUnemployed = false;
                }

                if (name === 'religion' && value !== 'อื่นๆ') newForm.religionOther = '';
                if (name === 'fatherTitle' && value !== 'อื่นๆ') newForm.fatherTitleOther = '';
                if (name === 'motherTitle' && value !== 'อื่นๆ') newForm.motherTitleOther = '';
                if (name === 'parentTitle' && value !== 'อื่นๆ') newForm.parentTitleOther = '';

                if (name === 'addrProv') { newForm.addrDist = ''; newForm.addrSub = ''; newForm.addrZip = ''; }
                if (name === 'addrDist') { newForm.addrSub = ''; newForm.addrZip = ''; }
                if (name === 'addrSub' && newForm.addrProv && newForm.addrDist) {
                    const match = initialData.provinces.find(p => p.prov === newForm.addrProv && p.dist === newForm.addrDist && p.sub === value);
                    if (match) newForm.addrZip = match.zip;
                }

                setFormData(newForm);
            };

            const handleNationalIdChange = (e) => {
                let val = e.target.value.replace(/\D/g, ''); 
                if (val.length > 13) val = val.slice(0, 13);
                let formatted = '';
                for (let i = 0; i < val.length; i++) {
                    if (i === 1 || i === 5 || i === 10 || i === 12) formatted += '-';
                    formatted += val[i];
                }
                setFormData(prev => ({ ...prev, nationalId: formatted }));
            };

            const handlePhoneChange = (e, field) => {
                let val = e.target.value.replace(/\D/g, '');
                if (val.length > 10) val = val.slice(0, 10);
                let formatted = '';
                for (let i = 0; i < val.length; i++) {
                    if (i === 3 || i === 6) formatted += '-';
                    formatted += val[i];
                }
                setFormData(prev => ({ ...prev, [field]: formatted }));
            };

            const calculateAge = (day, month, yearBE) => {
                if (!day || !month || !yearBE) return '';
                const yearCE = parseInt(yearBE) - 543;
                const dob = new Date(yearCE, parseInt(month) - 1, parseInt(day));
                const today = new Date();
                let age = today.getFullYear() - dob.getFullYear();
                const m = today.getMonth() - dob.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) { age--; }
                return age >= 0 ? age : '';
            };

            const getMonthName = (m) => {
                if(!m) return '';
                const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
                const idx = parseInt(m, 10) - 1;
                return (idx >= 0 && idx < 12) ? months[idx] : m;
            };

            const validateStep1 = () => {
                if (!formData.classLevel) return "กรุณาเลือกระดับชั้น";
                if (!formData.room) return "กรุณาเลือกห้องเรียน";
                if (!formData.fullName) return "กรุณาเลือกชื่อ-นามสกุล นักเรียน";
                if (!formData.studentCode) return "ไม่พบเลขประจำตัวนักเรียน (กรุณาเลือกชื่อใหม่อีกครั้ง)";
                if (!formData.nationalId || formData.nationalId.length !== 17) return "กรุณากรอกเลขบัตรประจำตัวประชาชนให้ครบ 13 หลัก";
                if (!formData.religion) return "กรุณาเลือกศาสนา";
                if (formData.religion === 'อื่นๆ' && !formData.religionOther) return "กรุณาระบุศาสนาที่นับถือ";
                if (!formData.studentTel || formData.studentTel.length !== 12) return "กรุณากรอกเบอร์โทรศัพท์นักเรียนให้ครบ 10 หลัก";
                if (!formData.dobDay || !formData.dobMonth || !formData.dobYear) return "กรุณาระบุวัน/เดือน/ปีเกิดให้ครบถ้วน";
                if (!formData.program) return "กรุณาเลือกแผนการเรียน";
                return null; 
            };

            const validateStep2 = () => {
                if (!formData.weight) return "กรุณากรอกน้ำหนัก";
                if (!formData.height) return "กรุณากรอกส่วนสูง";
                if (formData.hasDisease === 'true' && !formData.diseaseName) return "กรุณาระบุโรคประจำตัว";
                if (formData.hasDisability === 'true' && !formData.disabilityName) return "กรุณาระบุความพิการ";
                return null;
            };

            const validateStep3 = () => {
                if (!formData.fatherTitle) return "กรุณาเลือกคำนำหน้าชื่อบิดา (หากไม่ทราบให้เลือก '-')";
                if (formData.fatherTitle === 'อื่นๆ' && !formData.fatherTitleOther) return "กรุณาระบุคำนำหน้าชื่อบิดา";
                if (!formData.fatherFirstName) return "กรุณากรอกชื่อบิดา (หากไม่ทราบให้พิมพ์ '-')";
                if (!formData.fatherLastName) return "กรุณากรอกนามสกุลบิดา (หากไม่ทราบให้พิมพ์ '-')";
                if (!formData.fatherTel || formData.fatherTel.length !== 12) return "กรุณากรอกเบอร์โทรศัพท์บิดาให้ครบ 10 หลัก (หากไม่มีให้กรอก 0 ให้ครบ)";
                if (!formData.fatherUnemployed) {
                    if (!formData.fatherOccupation) return "กรุณากรอกอาชีพบิดา (หากไม่มี/ไม่ทราบให้พิมพ์ '-')";
                    if (!formData.fatherIncome) return "กรุณากรอกรายได้บิดาต่อเดือน (หากไม่มี/ไม่ทราบให้พิมพ์ '0')";
                }

                if (!formData.motherTitle) return "กรุณาเลือกคำนำหน้าชื่อมารดา (หากไม่ทราบให้เลือก '-')";
                if (formData.motherTitle === 'อื่นๆ' && !formData.motherTitleOther) return "กรุณาระบุคำนำหน้าชื่อมารดา";
                if (!formData.motherFirstName) return "กรุณากรอกชื่อมารดา (หากไม่ทราบให้พิมพ์ '-')";
                if (!formData.motherLastName) return "กรุณากรอกนามสกุลมารดา (หากไม่ทราบให้พิมพ์ '-')";
                if (!formData.motherTel || formData.motherTel.length !== 12) return "กรุณากรอกเบอร์โทรศัพท์มารดาให้ครบ 10 หลัก (หากไม่มีให้กรอก 0 ให้ครบ)";
                if (!formData.motherUnemployed) {
                    if (!formData.motherOccupation) return "กรุณากรอกอาชีพมารดา (หากไม่มี/ไม่ทราบให้พิมพ์ '-')";
                    if (!formData.motherIncome) return "กรุณากรอกรายได้มารดาต่อเดือน (หากไม่มี/ไม่ทราบให้พิมพ์ '0')";
                }

                if (!formData.parentsStatus) return "กรุณาเลือกสถานะบิดามารดาปัจจุบัน";
                if (!formData.livingWith) return "กรุณาเลือกปัจจุบันอาศัยอยู่กับใคร";

                if (!formData.parentTitle) return "กรุณาเลือกคำนำหน้าชื่อผู้ปกครอง (ใช้สำหรับติดต่อหลัก)";
                if (formData.parentTitle === 'อื่นๆ' && !formData.parentTitleOther && !formData.parentFirstName) return "กรุณาระบุคำนำหน้าชื่อ หรือชื่อผู้ปกครองหลัก";
                if (!formData.parentFirstName) return "กรุณากรอกชื่อผู้ปกครองหลัก";
                if (!formData.parentLastName) return "กรุณากรอกนามสกุลผู้ปกครองหลัก";
                if (!formData.parentRelation) return "กรุณาเลือกความเกี่ยวข้องกับนักเรียน (ผู้ปกครองหลัก)";
                if (!formData.parentTel || formData.parentTel.length !== 12) return "กรุณากรอกเบอร์โทรศัพท์ติดต่อผู้ปกครองหลักให้ครบ 10 หลัก";
                
                if (!formData.parentUnemployed) {
                    if (!formData.parentOccupation) return "กรุณากรอกอาชีพผู้ปกครองหลัก";
                    if (!formData.parentWorkplace) return "กรุณากรอกสถานที่ทำงานผู้ปกครองหลัก (หากไม่ทราบให้พิมพ์ '-')";
                    if (!formData.parentIncome) return "กรุณากรอกรายได้ผู้ปกครองหลัก";
                }
                return null;
            };

            const validateStep4 = () => {
                if (!formData.addrNo) return "กรุณากรอกบ้านเลขที่ (ช่องแรกสุด)";
                if (!formData.addrMoo) return "กรุณากรอกหมู่ที่ (หากไม่มีให้ใส่เครื่องหมาย -)";
                if (!formData.addrProv) return "กรุณาเลือกหรือพิมพ์ชื่อจังหวัด";
                if (!formData.addrDist) return "กรุณาเลือกหรือพิมพ์ชื่ออำเภอ/เขต";
                if (!formData.addrSub) return "กรุณาเลือกหรือพิมพ์ชื่อตำบล/แขวง";
                if (!formData.addrZip) return "ไม่พบรหัสไปรษณีย์ (กรุณาเลือกตำบลให้ถูกต้องระบบจะขึ้นให้อัตโนมัติ)";
                return null;
            };

            const nextStep = () => {
                let errorMsg = null;
                if (step === 1) errorMsg = validateStep1();
                if (step === 2) errorMsg = validateStep2();
                if (step === 3) errorMsg = validateStep3();

                if (errorMsg) {
                    setAlertMsg(errorMsg);
                    return; 
                }
                
                setStep(prev => prev + 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const prevStep = () => {
                setStep(prev => prev - 1);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleSubmit = async () => {
                const errorMsg = validateStep4();
                if (errorMsg) {
                    setAlertMsg(errorMsg);
                    return;
                }

                setIsSubmitting(true);
                try {
                    const fullAddress = [
                        formData.addrNo ? `บ้านเลขที่ ${formData.addrNo}` : '',
                        formData.addrMoo ? `หมู่ที่ ${formData.addrMoo}` : '',
                        formData.addrSub ? `ต.${formData.addrSub}` : '',
                        formData.addrDist ? `อ.${formData.addrDist}` : '',
                        formData.addrProv ? `จ.${formData.addrProv}` : '',
                        formData.addrZip || ''
                    ].filter(Boolean).join(' ');

                    const fTitle = formData.fatherTitle === 'อื่นๆ' ? formData.fatherTitleOther : formData.fatherTitle;
                    const fatherFullName = formData.fatherFirstName ? `${fTitle}${formData.fatherFirstName} ${formData.fatherLastName}`.trim() : '';

                    const mTitle = formData.motherTitle === 'อื่นๆ' ? formData.motherTitleOther : formData.motherTitle;
                    const motherFullName = formData.motherFirstName ? `${mTitle}${formData.motherFirstName} ${formData.motherLastName}`.trim() : '';

                    const pTitle = formData.parentTitle === 'อื่นๆ' ? formData.parentTitleOther : formData.parentTitle;
                    const parentFullName = formData.parentFirstName ? `${pTitle}${formData.parentFirstName} ${formData.parentLastName}`.trim() : '';

                    const payload = { 
                        ...formData, 
                        address: fullAddress,
                        fatherName: fatherFullName,
                        motherName: motherFullName,
                        parentName: parentFullName 
                    };

                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    if(result.status === 'success') {
                        sessionStorage.removeItem('schoolAppCache_v13');
                        setIsSuccess(true);
                    } else if (result.status === 'duplicate') {
                        setDuplicateAlert({
                            name: formData.fullName,
                            date: result.date || 'ระบบได้บันทึกไปแล้ว'
                        });
                        setStep(1); 
                    } else {
                        setAlertMsg("เกิดข้อผิดพลาดในการบันทึก: " + result.message);
                    }
                } catch (error) {
                    setAlertMsg("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์ กรุณาลองใหม่อีกครั้ง");
                    console.error(error);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const getBmiColor = (result) => {
                if (result.includes("น้อย")) return "text-blue-500 bg-blue-50 border-blue-200";
                if (result.includes("ปกติ")) return "text-green-600 bg-green-50 border-green-200";
                if (result.includes("ท้วม")) return "text-yellow-600 bg-yellow-50 border-yellow-200";
                if (result.includes("อ้วนมาก")) return "text-red-500 bg-red-50 border-red-200";
                if (result.includes("อ้วน")) return "text-orange-500 bg-orange-50 border-orange-200";
                return "text-gray-500 bg-gray-100 border-gray-200";
            };

            const Stepper = () => {
                const steps = [
                    { num: 1, title: 'ทั่วไป', icon: 'fa-user' },
                    { num: 2, title: 'สุขภาพ', icon: 'fa-heartbeat' },
                    { num: 3, title: 'ครอบครัว', icon: 'fa-users' },
                    { num: 4, title: 'ติดต่อ', icon: 'fa-address-card' }
                ];

                return (
                    <div className="flex justify-between items-center mb-6 sm:mb-8 relative px-2 sm:px-0">
                        <div className="absolute top-1/2 left-0 w-full h-1 bg-gray-200 -z-10 transform -translate-y-1/2 rounded"></div>
                        <div className="absolute top-1/2 left-0 h-1 bg-brand-orange -z-10 transform -translate-y-1/2 rounded transition-all duration-300" 
                             style={{ width: `${((step - 1) / (steps.length - 1)) * 100}%` }}></div>

                        {steps.map((s) => {
                            const isActive = step >= s.num;
                            const isCurrent = step === s.num;
                            return (
                                <div key={s.num} className="flex flex-col items-center w-1/4">
                                    <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-base sm:text-lg font-bold border-[3px] sm:border-4 transition-all duration-300
                                        ${isActive ? 'bg-brand-orange border-orange-100 text-white' : 'bg-white border-gray-200 text-gray-400'}
                                        ${isCurrent ? 'shadow-lg shadow-orange-200 scale-110' : ''}
                                    `}>
                                        <i className={`fas ${s.icon}`}></i>
                                    </div>
                                    <span className={`mt-1 sm:mt-2 text-[11px] sm:text-sm font-semibold text-center ${isActive ? 'text-brand-orange' : 'text-gray-400'}`}>
                                        {s.title}
                                    </span>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            if (showFinalPopup) {
                return (
                    <div className="bg-white rounded-xl sm:rounded-3xl shadow-xl sm:shadow-2xl p-6 sm:p-8 text-center fade-in w-full max-w-lg mx-auto border-t-8 border-green-500">
                        <div className="w-20 h-20 sm:w-24 sm:h-24 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-6 shadow-inner">

                            </span>

                return (
                    <div className="bg-white rounded-none sm:rounded-3xl shadow-none sm:shadow-2xl p-4 sm:p-6 md:p-10 fade-in w-full max-w-3xl mx-auto min-h-screen sm:min-h-0">

                                    <p><span className="font-bold text-gray-500">เลขบัตร ปชช.:</span> {formData.nationalId}</p>

                                    <p><span className="font-bold text-gray-500">น้ำหนัก:</span> {formData.weight} กก.</p>
                                    <p><span className="font-bold text-gray-500">ส่วนสูง:</span> {formData.height} ซม.</p>
                                    <p><span className="font-bold text-gray-500">ค่า BMI:</span> {formData.bmi} <span className="font-bold text-brand-orange">({formData.bmiResult})</span></p>

                                </div>

                                        <p><span className="font-bold text-gray-500">ชื่อ-นามสกุล:</span> {parentFullName}</p>
                                        <p><span className="font-bold text-gray-500">ความเกี่ยวข้อง:</span> {formData.parentRelation}</p>
                                        <p><span className="font-bold text-gray-500">เบอร์โทรติดต่อ:</span> {formData.parentTel}</p>
                                        <p><span className="font-bold text-gray-500">อาชีพ:</span> {formData.parentOccupation}</p>
                                        <p><span className="font-bold text-gray-500">รายได้/เดือน:</span> {formData.parentIncome}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gray-50 p-4 sm:p-5 rounded-xl border border-gray-200 shadow-sm">
                                <h3 className="font-bold text-gray-700 mb-3 text-base sm:text-lg border-b border-gray-200 pb-2"><i className="fas fa-address-card mr-2"></i>ส่วนที่ 4: ที่อยู่ปัจจุบัน</h3>
                                <div className="text-sm sm:text-base">
                                    <p className="leading-relaxed"><span className="font-bold text-gray-500">ที่อยู่:</span> {[
                                        formData.addrNo ? `บ้านเลขที่ ${formData.addrNo}` : '',
                                        formData.addrMoo ? `หมู่ที่ ${formData.addrMoo}` : '',
                                        formData.addrSub ? `ต.${formData.addrSub}` : '',
                                        formData.addrDist ? `อ.${formData.addrDist}` : '',
                                        formData.addrProv ? `จ.${formData.addrProv}` : '',
                                        formData.addrZip || ''
                                    ].filter(Boolean).join(' ')}</p>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 sm:mt-10 flex flex-col-reverse sm:flex-row justify-center gap-3 sm:gap-4 safe-area-pb">
                            <button onClick={() => { setIsSuccess(false); setStep(1); }} className="w-full sm:w-auto bg-white border-2 border-gray-300 hover:bg-gray-50 text-gray-700 px-6 py-3.5 sm:py-3 rounded-xl font-bold transition flex items-center justify-center text-[15px] sm:text-base">
                                <i className="fas fa-edit mr-2"></i> กลับไปแก้ไขข้อมูล
                            </button>
                            <button onClick={() => setShowFinalPopup(true)} className="w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white px-8 py-3.5 sm:py-3 rounded-xl font-bold shadow-md shadow-green-200 transition flex items-center justify-center text-[15px] sm:text-base">
                                <i className="fas fa-check-circle mr-2"></i> ยืนยันข้อมูลถูกต้อง
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="bg-white sm:rounded-3xl shadow-none sm:shadow-2xl overflow-hidden relative w-full min-h-screen sm:min-h-0 flex flex-col">
                    
                    {(isLoadingData || isSubmitting) && (
                        <div className="absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm animate-[fadeIn_0.3s_ease-out] p-4 text-center">
                            <div className="relative w-24 h-24 sm:w-32 sm:h-32 mb-4 sm:mb-6 flex items-center justify-center">
                                <div className="absolute inset-0 rounded-full border-[4px] sm:border-[6px] border-blue-100"></div>
                                <div className="absolute inset-0 rounded-full border-[4px] sm:border-[6px] border-blue-600 border-t-orange-500 animate-spin"></div>
                                
                                <div className="absolute inset-2 bg-white rounded-full flex items-center justify-center shadow-lg p-2 z-10 overflow-hidden">
                                    {initialData.schoolLogo ? (
                                        <img src={initialData.schoolLogo} alt="Loading..." className="w-full h-full object-contain" />
                                    ) : (
                                        <i className="fas fa-school text-4xl sm:text-5xl text-blue-600"></i>
                                    )}
                                </div>
                            </div>
                            <h3 className="text-xl sm:text-2xl font-bold text-blue-800 mb-2">กรุณารอสักครู่</h3>
                            <p className="text-sm sm:text-lg text-gray-600 font-medium animate-pulse">
                                {isSubmitting ? "ระบบกำลังอัปเดทฐานข้อมูล..." : "กำลังเตรียมพร้อมระบบและฐานข้อมูล..."}
                            </p>
                        </div>
                    )}

                    {duplicateAlert && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl sm:rounded-3xl shadow-2xl p-6 sm:p-8 w-[95%] sm:w-full max-w-sm text-center animate-[fadeIn_0.2s_ease-out]">
                                <div className="w-16 h-16 sm:w-20 sm:h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-5 shadow-inner">
                                    <i className="fas fa-user-lock text-3xl sm:text-4xl"></i>
                                </div>
                                <h3 className="text-xl sm:text-2xl font-bold text-gray-800 mb-2">ขึ้นทะเบียนแล้ว!</h3>
                                <p className="text-sm sm:text-base text-gray-600 mb-5 sm:mb-6 font-medium leading-relaxed">

                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-1">เบอร์โทรศัพท์ติดต่อ <span className="text-red-500">*</span></label>
                                            <div className="relative">
                                                <i className="fas fa-phone-alt absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                                <input type="tel" name="parentTel" value={formData.parentTel} onChange={(e) => handlePhoneChange(e, 'parentTel')} maxLength="12" className="w-full pl-12 p-3.5 sm:p-3 text-base sm:text-sm bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition font-mono tracking-widest text-center" placeholder="xxx-xxx-xxxx" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-4 rounded-xl border border-gray-200">
                                        <div className="flex items-center justify-between mb-3 border-b border-gray-100 pb-2">
                                            <label className="block text-[15px] sm:text-sm font-bold text-gray-700"><i className="fas fa-briefcase mr-2"></i>อาชีพและรายได้ (ผู้ปกครองหลัก)</label>
                                            <label className="flex items-center text-sm font-bold text-red-500 cursor-pointer hover:bg-red-50 px-2 py-1 rounded transition">
                                                <input type="checkbox" name="parentUnemployed" checked={formData.parentUnemployed} onChange={handleChange} className="mr-2 w-5 h-5 sm:w-4 sm:h-4 accent-red-500" />
                                                ไม่ได้ประกอบอาชีพ
                                            </label>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-[13px] sm:text-sm font-semibold text-gray-600 mb-1">อาชีพ <span className="text-red-500">*</span></label>
                                                <input type="text" name="parentOccupation" list="occupation-list" value={formData.parentOccupation} onChange={handleChange} disabled={formData.parentUnemployed} className="w-full p-3.5 sm:p-2 text-base sm:text-sm bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition disabled:bg-gray-100 disabled:text-gray-500" placeholder="ระบุอาชีพ" />
                                            </div>
                                            <div>
                                                <label className="block text-[13px] sm:text-sm font-semibold text-gray-600 mb-1">สถานที่ทำงาน <span className="text-red-500">*</span></label>
                                                <input type="text" name="parentWorkplace" value={formData.parentWorkplace} onChange={handleChange} disabled={formData.parentUnemployed} className="w-full p-3.5 sm:p-2 text-base sm:text-sm bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition disabled:bg-gray-100 disabled:text-gray-500" placeholder="ระบุ (ถ้าไม่มีใส่ -)" />
                                            </div>
                                            <div>
                                                <label className="block text-[13px] sm:text-sm font-semibold text-gray-600 mb-1">รายได้ต่อเดือน <span className="text-red-500">*</span></label>
                                                <input type="text" name="parentIncome" value={formData.parentIncome} onChange={handleChange} disabled={formData.parentUnemployed} className="w-full p-3.5 sm:p-2 text-base sm:text-sm bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition disabled:bg-gray-100 disabled:text-gray-500" placeholder="เช่น 15000" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        )}

                        {step === 4 && (
                            <div className="fade-in space-y-4 sm:space-y-5">
                                <h2 className="text-lg sm:text-xl font-bold text-brand-blue border-l-4 border-brand-orange pl-3">ส่วนที่ 4: ที่อยู่ปัจจุบันที่สามารถติดต่อได้</h2>
                                
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="col-span-1">
                                        <label className="block text-sm font-semibold text-gray-700 mb-1">บ้านเลขที่ <span className="text-red-500">*</span></label>
                                        <input type="text" name="addrNo" value={formData.addrNo} onChange={handleChange} className="w-full p-3.5 sm:p-3 text-base sm:text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition" placeholder="เช่น 123/4" />
                                    </div>
                                    <div className="col-span-1">
                                        <label className="block text-sm font-semibold text-gray-700 mb-1">หมู่ที่ <span className="text-red-500">*</span></label>
                                        <input type="text" name="addrMoo" value={formData.addrMoo} onChange={handleChange} className="w-full p-3.5 sm:p-3 text-base sm:text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition" placeholder="ไม่มีใส่ -" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-1">จังหวัด <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            name="addrProv" 
                                            value={formData.addrProv} 
                                            onChange={handleChange} 
                                            list="prov-list"
                                            autoComplete="off"
                                            className="w-full p-3.5 sm:p-3 text-base sm:text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition" 
                                            placeholder="พิมพ์เพื่อค้นหาจังหวัด" 
                                        />
                                        <datalist id="prov-list">
                                            {uniqueProvinces.map(p => <option key={p} value={p} />)}
                                        </datalist>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-1">อำเภอ/เขต <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            name="addrDist" 
                                            value={formData.addrDist} 
                                            onChange={handleChange} 
                                            list="dist-list"
                                            autoComplete="off"
                                            disabled={!formData.addrProv}
                                            className="w-full p-3.5 sm:p-3 text-base sm:text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition disabled:bg-gray-100 disabled:cursor-not-allowed" 
                                            placeholder="พิมพ์เพื่อค้นหาอำเภอ" 
                                        />
                                        <datalist id="dist-list">
                                            {availableDistricts.map(d => <option key={d} value={d} />)}
                                        </datalist>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-1">ตำบล/แขวง <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            name="addrSub" 
                                            value={formData.addrSub} 
                                            onChange={handleChange} 
                                            list="sub-list"
                                            autoComplete="off"
                                            disabled={!formData.addrDist}
                                            className="w-full p-3.5 sm:p-3 text-base sm:text-sm bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue outline-none transition disabled:bg-gray-100 disabled:cursor-not-allowed" 
                                            placeholder="พิมพ์เพื่อค้นหาตำบล" 
                                        />
                                        <datalist id="sub-list">
                                            {availableSubs.map(s => <option key={s} value={s} />)}
                                        </datalist>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                     <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-1">รหัสไปรษณีย์ <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            name="addrZip" 
                                            value={formData.addrZip} 
                                            readOnly
                                            className="w-full p-3.5 sm:p-3 text-base sm:text-sm bg-gray-100 border border-gray-300 rounded-xl outline-none font-bold text-gray-600 tracking-widest cursor-default" 
                                            placeholder="อัตโนมัติเมื่อเลือกตำบล" 
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="mt-8 sm:mt-10 flex flex-col-reverse sm:flex-row justify-between items-center border-t border-gray-100 pt-6 gap-3 sm:gap-0 safe-area-pb">
                            {step > 1 ? (
                                <button onClick={prevStep} disabled={isSubmitting} className="w-full sm:w-auto flex items-center justify-center text-gray-500 bg-gray-100 hover:bg-gray-200 px-6 py-3.5 sm:py-2.5 rounded-xl font-semibold transition disabled:opacity-50 text-[15px] sm:text-base">
                                    <i className="fas fa-chevron-left mr-2"></i> ย้อนกลับ
                                </button>
                            ) : (
                                <div className="hidden sm:block"></div> 
                            )}

                            {step < 4 ? (
                                <button onClick={nextStep} className="w-full sm:w-auto flex items-center justify-center text-white bg-brand-blue hover-bg-brand-blue px-8 py-3.5 sm:py-2.5 rounded-xl font-bold shadow-md shadow-blue-200 transition text-[15px] sm:text-base">
                                    ถัดไป <i className="fas fa-chevron-right ml-2"></i>
                                </button>
                            ) : (
                                <button onClick={handleSubmit} disabled={isSubmitting} className="w-full sm:w-auto flex items-center justify-center text-white bg-brand-orange hover-bg-brand-orange px-8 py-3.5 sm:py-2.5 rounded-xl font-bold shadow-md shadow-orange-200 transition disabled:opacity-70 text-[15px] sm:text-base">
                                    {isSubmitting ? (
                                        <><i className="fas fa-spinner fa-spin mr-2"></i> กำลังบันทึก...</>
                                    ) : (
                                        <><i className="fas fa-save mr-2"></i> ยืนยันบันทึกข้อมูล</>
                                    )}
                                </button>
                            )}
                        </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
